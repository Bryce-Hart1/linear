[package]
name = "linear-app"
description = "linear: an editor for diagrams, pixel art and drawings"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "linear_app"

[[bin]]
name = "linear"
path = "src/main.rs"

[build-dependencies]
# 11/09/2026: generates the app context (config, icons, permissions) from
# tauri.conf.json and capabilities/. Same release train as `tauri` below.
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
linear-store = { path = "../../crates/store" }
# 11/09/2026: the desktop shell: one window on the system webview (WKWebView
# on macOS), the native menu, and commands and events between it and Rust.
tauri = { version = "2.12.4", features = [] }
# 11/09/2026: the native open and save panels (import, export).
tauri-plugin-dialog = "2.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
